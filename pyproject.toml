[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuosclab"
version = "1.0.0"
description = "Interactive PMNS + NSI neutrino oscillation probability viewer, with a frontend-neutral computation API and pluggable oscillation engines."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gavin S. Davies" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/gavinsdavies/nuosclab"
Repository = "https://github.com/gavinsdavies/nuosclab"
Changelog = "https://github.com/gavinsdavies/nuosclab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
    "bokeh>=3.9",
]
app = [
    "panel>=1.8",
]
notebook = [
    "matplotlib>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.1",
    "jupyterlab>=4.1",
    "ipykernel",
]
dev = [
    "bokeh>=3.9",
    "panel>=1.8",
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nuosclab*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
