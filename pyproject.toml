[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osclib-explorer"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.1",
    "jupyterlab>=4.1",
    "ipykernel",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["osclib_explorer*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
